# OLED
CONFIG_ZMK_DISPLAY=y

# RGB underglow / backlight
CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_LED_STRIP=y

# EXT_POWER=n -> RGB_TOG nie odcina już VCC, więc OLED zostaje włączony
# nawet gdy podświetlenie jest wyłączone
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

CONFIG_ZMK_RGB_UNDERGLOW_BRT_MIN=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=10
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y

# Bluetooth
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# Optymalizacja baterii
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

CONFIG_ZMK_POINTING=n
CONFIG_ZMK_PM_SOFT_OFF=y

CONFIG_ZMK_SETTINGS_RESET_ON_START=n
