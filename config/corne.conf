# OLED
CONFIG_ZMK_DISPLAY=y

# RGB underglow / backlight
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MIN=10
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=40
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y

# Bluetooth
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# Domyślny start klawiatury w trybie Bluetooth (nawet po podłączeniu kabla USB)
CONFIG_ZMK_OUTPUT_BEHAVIOR_PREFERENCE_BLE=y

# Optymalizacja baterii - Deep Sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

CONFIG_ZMK_POINTING=y
CONFIG_ZMK_PM_SOFT_OFF=y
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=y
